name: 'Remove old GHCR.io Images'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true

jobs:
  cleanup-images:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Cleanup old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: registry
          use-regex: true
          exclude-tags: '^(latest|main|v\d+\.\d+\.\d+.*)$'
          keep-n-tagged: 10
          delete-untagged: true
          delete-partial-images: true
          older-than: 5 days
          # Scheduled runs delete; manual runs default to a dry run.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
